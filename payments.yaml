# Payment provider routing (per region).
# Atlas opens PRs here to remediate incidents. When a region active_provider
# starts failing, Atlas flips it to the declared fallback and ships the change
# as a real, reviewable Pull Request.
regions:
  EMEA: { active_provider: stripe, fallback: adyen }
  NA:   { active_provider: stripe, fallback: adyen }
  APAC: { active_provider: adyen, fallback: paypal }
